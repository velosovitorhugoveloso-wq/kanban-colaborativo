<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanban Colaborativo</title><style>
:root{--teal:#0f766e;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--bg:#f4f6fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Arial}button,input,textarea,select{font:inherit}button{border:0;border-radius:9px;padding:10px 14px;font-weight:650;cursor:pointer}.primary{background:var(--teal);color:white}.soft{background:#e8eef5;color:#334155}.danger{background:#fee2e2;color:#991b1b}.shell{max-width:1250px;margin:auto;padding:22px}.top,.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.logo{background:var(--teal);color:white;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;font-size:22px;font-weight:900}.brand h1{margin:0;font-size:21px}.brand p,.muted{margin:2px 0;color:var(--muted);font-size:13px}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 7px 20px #0f172a0c}.toolbar{margin:20px 0}.toolbar h2{margin:0;font-size:19px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select,.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:8px;padding:10px;background:white;min-width:0}.stats{display:flex;gap:10px;margin-bottom:17px;flex-wrap:wrap}.stat{background:white;border:1px solid var(--line);padding:11px 16px;border-radius:11px;min-width:120px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}.board{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:14px;align-items:start}.column{background:#eaf0f6;border:1px solid #dfe7ef;border-radius:14px;padding:11px;min-height:280px}.colhead{display:flex;justify-content:space-between;padding:4px 3px 12px;font-weight:750}.count{background:#d7e2ed;border-radius:20px;padding:2px 8px;font-size:12px}.list{display:grid;gap:9px;min-height:190px}.task{background:white;border:1px solid var(--line);border-radius:11px;padding:12px;cursor:grab}.task h4{margin:7px 0 5px;font-size:14px}.task p{margin:0;color:var(--muted);font-size:12px}.task.drag{opacity:.4}.pill{font-size:10px;border-radius:20px;padding:3px 8px;background:#e0f2fe;color:#075985;font-weight:750}.high{background:#fee2e2;color:#991b1b}.medium{background:#fef3c7;color:#92400e}.low{background:#dcfce7;color:#166534}.taskfoot{display:flex;justify-content:space-between;gap:5px;align-items:center;margin-top:11px;color:var(--muted);font-size:11px}.empty{padding:30px 8px;text-align:center;color:#94a3b8;border:1px dashed #cbd5e1;border-radius:9px;font-size:12px}.members,.history{margin-top:18px}.member{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.auth{max-width:420px;margin:7vh auto;padding:22px}.auth h1{margin:0 0 5px}.tabs{display:flex;gap:7px;margin:17px 0}.field{display:grid;gap:5px;margin:11px 0}.field label{font-size:12px;font-weight:700;color:#475569}.field input,.field textarea,.field select{width:100%}.field textarea{min-height:70px}.hidden{display:none!important}.modalbg{position:fixed;inset:0;background:#0f172a88;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modalbg.show{display:flex}.modal{background:white;padding:21px;border-radius:16px;width:min(650px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{font-size:19px;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.comment{border-bottom:1px solid var(--line);padding:9px 0;font-size:13px}.comment small{display:block;color:var(--muted)}.toast{position:fixed;bottom:18px;right:18px;background:#172554;color:white;padding:12px 16px;border-radius:10px;display:none;z-index:20}.footnote{font-size:11px;color:var(--muted);margin-top:18px}@media(max-width:800px){.board{grid-template-columns:1fr}.shell{padding:14px}.grid{grid-template-columns:1fr}.filters{width:100%}.filters>*{flex:1}}
</style></head><body><div id="app"></div><div id="modalbg" class="modalbg"><div class="modal" id="modal"></div></div><div id="toast" class="toast"></div><script>
let csrf='',me=null,board=null,tasks=[],members=[],activities=[],filter='',priority='all',selectedTask=null,dragId=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,method='GET',body=null){let r=await fetch('/api'+url,{method,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body?JSON.stringify(body):null});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ocorreu um erro.');return d}async function getCsrf(){csrf=(await(await fetch('/api/csrf')).json()).token}function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2800)}
function authView(mode='login'){let reg=mode==='register';$('#app').innerHTML=`<div class="panel auth"><div class="brand"><div class="logo">K</div><div><h1>Kanban colaborativo</h1><p>Organize o trabalho da sua equipe</p></div></div><div class="tabs"><button class="${!reg?'primary':'soft'}" onclick="authView('login')">Entrar</button><button class="${reg?'primary':'soft'}" onclick="authView('register')">Criar conta</button></div><form onsubmit="authSubmit(event,'${mode}')">${reg?'<div class="field"><label>Nome completo</label><input name="name" required minlength="2"></div>':''}<div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Senha ${reg?'(mínimo 8 caracteres)':''}</label><input name="password" type="password" required ${reg?'minlength="8"':''}></div><button class="primary" style="width:100%">${reg?'Criar minha conta':'Entrar'}</button></form><p class="footnote">As senhas são protegidas por hash. Cada usuário tem sua própria conta.</p></div>`}
async function authSubmit(e,mode){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());try{await api(mode==='login'?'/login':'/register','POST',d);await loadBoard()}catch(x){toast(x.message)}}async function loadBoard(){try{let d=await api('/board');board=d.board;me=d.me;members=d.members;tasks=d.tasks;activities=d.activities;render()}catch(e){authView()}}
function render(){let total=tasks.length,done=tasks.filter(t=>t.status==='done').length,doing=tasks.filter(t=>t.status==='doing').length,can=me.role!=='VIEWER';$('#app').innerHTML=`<main class="shell"><header class="top"><div class="brand"><div class="logo">K</div><div><h1>Kanban colaborativo</h1><p>Quadro compartilhado • ${esc(me.name)} (${me.role})</p></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="soft" onclick="openMembers()" ${me.role==='OWNER'?'':'disabled'}>Compartilhar quadro</button><button class="soft" onclick="renameBoard()" ${me.role==='OWNER'?'':'disabled'}>Renomear quadro</button><button class="primary" onclick="openTask()" ${can?'':'disabled'}>＋ Nova tarefa</button><button class="soft" onclick="logout()">Sair</button></div></header><section class="panel toolbar"><div><h2>${esc(board.name)}</h2><span class="muted">${members.length} participante(s) • Atualização automática a cada 5 segundos</span></div><div class="filters"><input placeholder="Buscar tarefa..." value="${esc(filter)}" oninput="filter=this.value;render()"><select onchange="priority=this.value;render()"><option value="all">Todas prioridades</option><option value="high" ${priority==='high'?'selected':''}>Alta</option><option value="medium" ${priority==='medium'?'selected':''}>Média</option><option value="low" ${priority==='low'?'selected':''}>Baixa</option></select></div></section><div class="stats"><div class="stat"><b>${total}</b><span>Tarefas totais</span></div><div class="stat"><b>${doing}</b><span>Em andamento</span></div><div class="stat"><b>${done}</b><span>Concluídas</span></div><div class="stat"><b>${total?Math.round(done/total*100):0}%</b><span>Progresso</span></div></div><section class="board">${[['todo','A Fazer'],['doing','Em Andamento'],['done','Concluído']].map(([id,name])=>{let arr=tasks.filter(t=>t.status===id&&(!filter||(t.title+' '+t.description+' '+t.labels.join(' ')).toLowerCase().includes(filter.toLowerCase()))&&(priority==='all'||t.priority===priority));return `<div class="column" ondragover="event.preventDefault()" ondrop="dropTask('${id}')"><div class="colhead">${name}<span class="count">${arr.length}</span></div><div class="list">${arr.length?arr.map(t=>card(t,can)).join(''):'<div class="empty">Arraste tarefas para esta coluna</div>'}</div>${can?`<button class="soft" style="width:100%;margin-top:9px" onclick="openTask(null,'${id}')">＋ Adicionar tarefa</button>`:''}</div>`}).join('')}</section><section class="panel members"><b>Participantes</b>${members.map(m=>`<div class="member"><span>${esc(m.name)}<br><small class="muted">${esc(m.email)}</small></span><span class="pill">${m.role}</span></div>`).join('')}</section><section class="panel history"><b>Histórico de atividades</b>${activities.length?activities.slice(0,8).map(a=>`<div class="member"><span>${esc(a.message)}<br><small class="muted">${esc(a.who)} • ${new Date(a.date).toLocaleString('pt-BR')}</small></span></div>`).join(''):'<p class="muted">As atividades aparecerão aqui.</p>'}</section><p class="footnote">Projeto acadêmico • Flask + PostgreSQL • Senhas com hash • Permissões validadas no servidor</p></main>`}
function card(t,can){let n=t.checklist.filter(c=>c.done).length;return `<article class="task" draggable="${can}" ondragstart="dragId=${t.id};this.classList.add('drag')" ondragend="this.classList.remove('drag')" onclick="openDetail(${t.id})"><span class="pill ${t.priority}">${t.priority==='high'?'Prioridade alta':t.priority==='medium'?'Prioridade média':'Prioridade baixa'}</span><h4>${esc(t.title)}</h4><p>${esc(t.description)}</p><div>${t.labels.map(x=>`<span class="pill">${esc(x)}</span>`).join(' ')}</div><div class="taskfoot"><span>◷ ${t.deadline?new Date(t.deadline+'T12:00:00').toLocaleDateString('pt-BR'):'Sem prazo'}</span><span>${n}/${t.checklist.length} ✓</span><span>${esc(t.responsible)}</span></div></article>`}
async function refresh(){if(!me)return;try{let d=await api('/board');board=d.board;members=d.members;tasks=d.tasks;activities=d.activities;render()}catch(e){}}async function dropTask(status){if(dragId==null||me.role==='VIEWER')return;let t=tasks.find(x=>x.id===dragId);try{await api('/tasks/'+t.id,'PUT',{status});dragId=null;await refresh()}catch(x){toast(x.message)}}function showModal(s){$('#modal').innerHTML=s;$('#modalbg').classList.add('show')}function closeModal(){$('#modalbg').classList.remove('show')}$('#modalbg').addEventListener('click',e=>{if(e.target.id==='modalbg')closeModal()});
function openTask(t=null,status='todo'){let edit=!!t;showModal(`<div class="modalhead"><h2>${edit?'Editar tarefa':'Nova tarefa'}</h2><button class="soft" onclick="closeModal()">✕</button></div><form onsubmit="saveTask(event,${edit?t.id:'null'})"><div class="field"><label>Título</label><input name="title" required value="${esc(t?.title||'')}"></div><div class="field"><label>Descrição</label><textarea name="description">${esc(t?.description||'')}</textarea></div><div class="grid"><div class="field"><label>Coluna</label><select name="status"><option value="todo" ${(t?.status||status)==='todo'?'selected':''}>A Fazer</option><option value="doing" ${(t?.status||status)==='doing'?'selected':''}>Em Andamento</option><option value="done" ${(t?.status||status)==='done'?'selected':''}>Concluído</option></select></div><div class="field"><label>Responsável</label><select name="responsible">${members.map(m=>`<option ${((t?.responsible||me.name)===m.name)?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>Prazo</label><input name="deadline" type="date" value="${t?.deadline||''}"></div><div class="field"><label>Prioridade</label><select name="priority"><option value="low" ${t?.priority==='low'?'selected':''}>Baixa</option><option value="medium" ${!t||t.priority==='medium'?'selected':''}>Média</option><option value="high" ${t?.priority==='high'?'selected':''}>Alta</option></select></div><div class="field"><label>Labels (vírgula)</label><input name="labels" value="${esc(t?.labels.join(', ')||'')}"></div><div class="field"><label>Story points</label><input name="points" type="number" min="0" max="100" value="${t?.points||0}"></div></div><div class="field"><label>Sprint</label><input name="sprint" value="${esc(t?.sprint||'')}"></div><div class="modalactions"><button type="button" class="soft" onclick="closeModal()">Cancelar</button><button class="primary">Salvar</button></div></form>`)}
async function saveTask(e,id){e.preventDefault();let f=new FormData(e.target),d={title:f.get('title'),description:f.get('description'),status:f.get('status'),responsible:f.get('responsible'),deadline:f.get('deadline'),priority:f.get('priority'),labels:f.get('labels').split(',').map(x=>x.trim()).filter(Boolean),points:+f.get('points'),sprint:f.get('sprint')};try{await api(id?'/tasks/'+id:'/tasks',id?'PUT':'POST',d);closeModal();await refresh();toast('Tarefa salva no banco de dados.')}catch(x){toast(x.message)}}
function openDetail(id){selectedTask=tasks.find(t=>t.id===id);let t=selectedTask,can=me.role!=='VIEWER';showModal(`<div class="modalhead"><h2>${esc(t.title)}</h2><button class="soft" onclick="closeModal()">✕</button></div><p class="muted">${esc(t.description)}</p><div class="grid"><div class="panel"><b>Responsável</b><p>${esc(t.responsible)}</p></div><div class="panel"><b>Prazo</b><p>${t.deadline||'Sem prazo'}</p></div><div class="panel"><b>Sprint / pontos</b><p>${esc(t.sprint)} • ${t.points} pts</p></div><div class="panel"><b>Labels</b><p>${t.labels.map(esc).join(', ')}</p></div></div><h3>Checklist</h3>${t.checklist.map(c=>`<label style="display:block;padding:5px"><input type="checkbox" ${c.done?'checked':''} onchange="checkItem(${c.id},this.checked)" ${can?'':'disabled'}> ${esc(c.text)}</label>`).join('')}${can?'<form onsubmit="addCheck(event)" style="display:flex;gap:7px;margin-top:8px"><input name="text" required placeholder="Nova subtarefa" style="flex:1;min-width:0;padding:9px;border:1px solid var(--line);border-radius:8px"><button class="soft">Adicionar</button></form>':''}<h3>Comentários</h3>${t.comments.map(c=>`<div class="comment">${esc(c.text)}<small>${esc(c.author)} • ${new Date(c.date).toLocaleString('pt-BR')}</small></div>`).join('')||'<p class="muted">Sem comentários.</p>'}${can?`<form onsubmit="addComment(event)" style="display:flex;gap:7px;margin-top:9px"><input name="text" required placeholder="Escreva um comentário..." style="flex:1;min-width:0;padding:9px;border:1px solid var(--line);border-radius:8px"><button class="primary">Enviar</button></form><div class="modalactions"><button class="soft" onclick="closeModal();openTask(tasks.find(x=>x.id===${t.id}))">Editar</button><button class="danger" onclick="deleteTask(${t.id})">Excluir</button></div>`:''}`)}
async function addComment(e){e.preventDefault();try{await api('/tasks/'+selectedTask.id+'/comments','POST',{text:new FormData(e.target).get('text')});await refresh();selectedTask=tasks.find(t=>t.id===selectedTask.id);openDetail(selectedTask.id)}catch(x){toast(x.message)}}async function addCheck(e){e.preventDefault();try{await api('/tasks/'+selectedTask.id+'/checklist','POST',{text:new FormData(e.target).get('text')});await refresh();selectedTask=tasks.find(t=>t.id===selectedTask.id);openDetail(selectedTask.id)}catch(x){toast(x.message)}}async function checkItem(id,done){try{await api('/checklist/'+id,'PATCH',{done});await refresh();selectedTask=tasks.find(t=>t.id===selectedTask.id);openDetail(selectedTask.id)}catch(x){toast(x.message)}}async function deleteTask(id){if(!confirm('Excluir esta tarefa?'))return;try{await api('/tasks/'+id,'DELETE');closeModal();await refresh()}catch(x){toast(x.message)}}
function openMembers(){showModal(`<div class="modalhead"><h2>Compartilhar quadro</h2><button class="soft" onclick="closeModal()">✕</button></div><p class="muted">A pessoa precisa criar uma conta primeiro. Informe o mesmo e-mail usado no cadastro.</p><form onsubmit="addMember(event)"><div class="field"><label>E-mail do participante</label><input name="email" type="email" required></div><div class="field"><label>Permissão</label><select name="role"><option value="EDITOR">Editor — cria e edita tarefas</option><option value="VIEWER">Leitor — somente visualização</option></select></div><button class="primary">Adicionar ao quadro</button></form><h3>Participantes</h3>${members.map(m=>`<div class="member"><span>${esc(m.name)}<br><small class="muted">${esc(m.email)}</small></span><span>${m.role==='OWNER'?'Dono':m.role==='EDITOR'?'Editor':'Leitor'} ${m.role!=='OWNER'?`<button class="danger" onclick="removeMember('${encodeURIComponent(m.email)}')">Remover</button>`:''}</span></div>`).join('')}`)}async function addMember(e){e.preventDefault();let f=new FormData(e.target);try{await api('/members','POST',{email:f.get('email'),role:f.get('role')});await refresh();openMembers();toast('Participante adicionado!')}catch(x){toast(x.message)}}async function removeMember(email){if(!confirm('Remover participante?'))return;try{await api('/members/'+decodeURIComponent(email),'DELETE');await refresh();openMembers()}catch(x){toast(x.message)}}async function renameBoard(){let name=prompt('Nome do quadro:',board.name);if(!name)return;try{await api('/board','PUT',{name});await refresh()}catch(x){toast(x.message)}}async function logout(){try{await api('/logout','POST')}catch(e){}me=null;authView()}
(async()=>{await getCsrf();await loadBoard()})();setInterval(()=>{if(me)refresh()},5000);
</script></body></html>
